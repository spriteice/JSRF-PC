# CI: every push and pull request is built and tested on Linux and Windows,
# without the game's files. Each job's steps are a script in .github/ci, run
# in the build image (launcher/image.sh) by .github/ci/docker.sh, so the same
# commands run anywhere with Docker. docs/build-and-test-reference.md ("CI")
# says what each job checks, and how to run it, and ("What is kept between
# builds") how the build images are kept.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # On a push to main, each build image not yet published for this
  # launcher/image.sh (and the conformance image, for launcher/image-386.sh)
  # is made and published on GitHub's registry (launcher/images.sh), and the
  # jobs in its images wait for it, so that even the push that changes a
  # recipe pulls its images. Anywhere else this job publishes nothing, and a
  # job whose image isn't published makes it.
  images:
    name: Build image (${{ matrix.groups }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        groups: ["linux", "linux tests", "windows", "conformance"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - name: Publish it unless it's there
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          IMAGE_GROUPS: ${{ matrix.groups }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          launcher/images.sh publish "$IMAGE_GROUPS"

  linux-gcc:
    name: Linux, GCC
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - run: .github/ci/docker.sh "linux tests" .github/ci/linux.sh gcc

  linux-clang:
    name: Linux, clang, and the package
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - run: .github/ci/docker.sh "linux tests" .github/ci/linux.sh clang

  thread-sanitizer:
    name: Thread sanitizer
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - run: .github/ci/docker.sh "linux tests" .github/ci/tsan.sh

  address-sanitizer:
    name: Address and undefined-behaviour sanitizers
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - run: .github/ci/docker.sh "linux tests" .github/ci/asan.sh

  conformance:
    name: Recompiler conformance tests
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - run: .github/ci/docker.sh conformance .github/ci/conformance.sh

  windows-build:
    name: Windows build and package
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - run: .github/ci/docker.sh windows .github/ci/windows.sh

  windows-tests:
    name: Windows tests
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.12.10"
      - name: llvm-mingw
        shell: bash
        run: python .github/ci/llvm_mingw.py "$RUNNER_TEMP/llvm-mingw" >> "$GITHUB_PATH"
      - name: Engine tests
        shell: bash
        run: python tests/run_all.py
