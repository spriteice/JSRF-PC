# The performance review's finish line, as the b3.1 plan proposes it (its
# section 5, "The finish line"), for the route's runs before and after each
# b3 row that changes timing. Read by tools/logcompare.py:
#
#     python3 tools/logcompare.py tools/checks/finish-line.ini AFTER.log --before BEFORE.log ...
#
# Line 2 is line 1 on battery, and line 6 is line 1 in 99th Street over
# three runs: the same checks, run on those logs. Line 4 (p95 and p99 of the
# frame time) waits for b3.1 row 6's per-frame trace.
#
# No before is written here: the plan's figures were read over a visit or a
# whole run, not a report. The before is the baseline's logs, with --before.

[1a]
name = The Ally X: every 10 s report at most 5% late at the flip
device = linux
measure = report late_pct
take = max
limit = <= 5

[1b]
name = The Ally X: every 10 s report at most 3 frames held
device = linux
measure = report held
take = max
limit = <= 3

# Every [HITCH] frame from the first stage on, so not the frames of the
# start before it. The game lists the first 200 of a run that took 25 ms or
# longer, then every 50th, which takes in every level's entry on the route.
[3]
name = No frame over 50 ms on entering a level
line = [HITCH] frame {}: {ms} ms flip to flip
from = [LOAD] t={} mission ... asks for stage
take = max
limit = <= 50

[5]
name = The Windows PC: every 10 s report under 1% late
device = windows
measure = report late_pct
take = max
limit = < 1
